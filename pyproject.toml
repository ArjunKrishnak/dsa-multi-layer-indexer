[project]
name = "lagged-indexer-dsa"
version = "0.1.0"
description = "Multi-layer Indexer (MLI): overlapping selection and attention in DeepSeek Sparse Attention."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Serdarcan Dilbaz", email = "serdarcan@writer.com" },
    { name = "Arjun Krishna", email = "arjun@writer.com" },
    { name = "Kiran Kamble", email = "kiran@writer.com" },
    { name = "Daniel M. Bikel", email = "dan.bikel@writer.com" },
]
requires-python = ">=3.10"
dependencies = [
    "apache-tvm-ffi==0.1.11",
    "datasets>=2.15,<3.0",
    "einops>=0.8.2",
    "ninja>=1.11",
    "numpy>=2.2.6",
    "rouge>=1.0.1",
    "safetensors>=0.4.0",
    "tilelang>=0.1.11",
    "torch>=2.12.1",
    "transformers>=5.3",
]

[build-system]
requires = ["uv_build>=0.8.23,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
